schema_version = 1
name = "jepatransformer-visual-dmc"

[observations]
upstream_profile = "dmc_vision"
kind = "rgb"
height = 64
width = 64
action_repeat = 1
proprio = false

[accounting]
training_budget_unit = "real_environment_transition"
count_training_transitions = true
count_evaluation_transitions_separately = true
report_total_real_transitions = true
curve_bin_transitions = 10000

[evaluation]
checkpoint_policy = "latest"
checkpoint_search = false
deterministic_actions = true
episodes = 20
parallel_envs = 4
episode_length = 1000
seed = 10000

[phase_1]
purpose = "native upstream baseline reproduction"
tasks = ["dmc_walker_walk", "dmc_cheetah_run"]
seeds = [0, 1]
train_transitions = 1100000

[phase_2]
purpose = "matched JEPA-RSSM promotion gate"
tasks = [
  "dmc_reacher_easy",
  "dmc_walker_walk",
  "dmc_cheetah_run",
  "dmc_hopper_hop",
]
seeds = [0, 1]
train_transitions = 250000
minimum_dreamer_aggregate_auc_ratio = 0.80
minimum_per_task_dreamer_auc_ratio = 0.50
require_every_task_above_random = true
require_no_representation_collapse = true

[reporting]
primary_curve = "latest_policy_episode_return"
aggregate_statistics = ["median", "iqm"]
confidence_interval = "stratified_bootstrap_95"
efficiency_metrics = [
  "trainable_parameters",
  "peak_vram_bytes",
  "world_model_updates_per_second",
  "imagined_steps_per_second",
  "gpu_hours_to_fixed_return",
]
