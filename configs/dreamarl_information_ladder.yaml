contract: equal_capacity_h1_information_ladder_v1
dataset:
  trajectories: 48
  context: 64
  length: 32
  include_observations: true
  target: stopped_next_representation
  split:
    train: 0.6
    validation: 0.2
    test: 0.2
    unit: complete_trajectory
predictor:
  feature_width: 512
  hidden: 256
  learning_rate: 3.0e-4
  steps: 3000
  batch_trajectories: 8
  seeds: [0, 1, 2]
  bootstrap_samples: 2000
tasks:
  - meltingpot_externality_mushrooms__dense
  - meltingpot_pure_coordination_in_the_matrix__repeated
  - meltingpot_coop_mining
promotion:
  require_full_target_improvement: true
  require_residual_improvement: true
  require_trajectory_ci_low_above_zero: true
  require_replication_across_predictor_seeds: true
  require_reward_event_relevance_when_available: true
  horizons_before_promotion: [1]
