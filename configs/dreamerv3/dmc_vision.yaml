# Immutable baseline contract for visual DeepMind Control Suite experiments.
# Learning hyperparameters are loaded directly from the pinned upstream
# dreamerv3/configs.yaml dmc_vision profile.
implementation:
  repository: https://github.com/danijar/dreamerv3.git
  commit: e3f02248693a79dc8b0ebd62c93683888ddaccfe
  config: dmc_vision

observations:
  kind: rgb
  size: [64, 64]
  proprio: false
  action_repeat: 1

phase_1_reproduction:
  tasks: [dmc_walker_walk, dmc_cheetah_run]
  train_env_steps: 1100000
  seeds: [0, 1]
  final_eval_episodes: 20
  final_eval_seed: 10000
  checkpoint_selection: latest

reporting:
  curve_bin_env_steps: 10000
  count_training_env_steps: true
  count_evaluation_env_steps_separately: true
  report_total_real_env_steps: true
  select_best_checkpoint: false
