defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: meltingpot_externality_mushrooms__dense
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 128
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope, wandb]
    filter: 'score|return|length|fps|ratio|train/loss/|train/rand/|train/posterior_jepa/|train/dynamics_jepa/|report/world_model/|report/openloop/|eval/'
    timer: True
    fps: 15
    user: ''

  env:
    meltingpot: {size: [64, 64], max_cycles: 1000, use_seed: True, collective_reward: True}
    dmc: {size: [64, 64], repeat: 1, proprio: False, image: True, camera: -1, use_seed: True}

  replay:
    size: 5e6
    online: True
    chunksize: 1024

  run:
    steps: 5e4
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    final_save: True
    envs: 1
    eval_envs: 4
    eval_eps: 1
    eval_policy_mode: eval
    curve_eval_interval: 0
    curve_eval_eps: 20
    curve_eval_seed_offset: 10000
    curve_eval_policy_mode: eval
    report_batches: 1
    from_checkpoint: ''
    from_checkpoint_regex: '.*'
    episode_timeout: 180
    probe_source: ''
    probe_batches: 10
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    expect_devices: 0
    enable_policy: True
    precompile: True
    profiler: True
    coordinator_address: ''

  agent:
    num_agents: 1
    marl:
      stage: b0
      execution: strict_decentralized
      agent_jepa: {slots: 8, width: 256, heads: 4, layers: 2, predictor_layers: 2, ffup: 4, predictor_hidden: 512, local_grad_scale: 0.0, k0_scale: 0.1, future_scale: 1.0, future_set_scale: 1.0, teacher_rate: 0.01, teacher_every: 1, mask_min: 0.25, mask_max: 0.5, matching_temperature: 0.02, sinkhorn_iterations: 10, predicted_set_scale: 1.0, source_set_scale: 1.0, hidden_coverage_scale: 1.0, variance_scale: 0.1, covariance_scale: 0.1, slot_target_std: 0.1, utility_probe: False, act: silu, norm: rms, winit: trunc_normal_in}
    objective: embedding
    embedding_target: ema
    embedding_loss: cosine
    posterior_jepa: True
    dynamics_jepa: True
    spatial_jepa:
      enabled: True
      mask_ratio: 0.5
      topology: fixed_count
      fill_value: 128
    sigreg: {enabled: True, knots: 17, num_proj: 256, aggregation: per_agent}
    loss_scales: {posterior_jepa: 2.0, dynamics_jepa: 2.0, spatial_jepa: 1.0, agent_jepa: 1.0, sigreg: 0.05, action_mask: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    target_encoder: {rate: 0.01, every: 1}
    ac_grads: False
    dyn:
      typ: parallel_transformer
      parallel_transformer: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0, model: 512, layers: 2, heads: 8, context: 64, ffup: 4, posterior_context: history}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    maskhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 0.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

meltingpot_vision:
  task: meltingpot_externality_mushrooms__dense
  run: {steps: 5e4, train_ratio: 256, envs: 1}
  jax.profiler: False
  jax.prealloc: False

dmc_vision:
  task: dmc_reacher_easy
  run: {steps: 1.1e6, train_ratio: 256, envs: 16}
  jax.profiler: False
  jax.prealloc: False

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.model: 8
    .*\.heads: 2
    .*\.context: 16
    .*\.ffup: 2
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2
