# Reference: completed WM4096 / 1e-4 runs, 2026-09-12.
# Profiles below reproduce the ongoing size/LR sweep; they are not promoted defaults.
defaults:
  agent:
    action_mask_reduction: balanced
    conhead:
      act: silu
      layers: 1
      norm: rms
      output: binary
      outscale: 1.0
      units: 512
      winit: trunc_normal_in
    contdisc: true
    dyn:
      parallel_transformer:
        act: silu
        classes: 64
        context: 64
        deter: 4096
        ffup: 4
        free_nats: 1.0
        heads: 8
        hidden: 512
        imglayers: 2
        layers: 2
        model: 512
        norm: rms
        obslayers: 1
        outscale: 1.0
        posterior_context: history
        stoch: 32
        unimix: 0.01
        winit: trunc_normal_in
    enc:
      simple:
        act: silu
        layers: 3
        norm: rms
        symlog: true
        units: 1024
        winit: trunc_normal_in
    horizon: 333
    imag_last: 0
    imag_length: 5
    loss_scales:
      action_mask: 1.0
      con: 1.0
      ctde_action_mask: 1.0
      ctde_alive: 1.0
      ctde_continuation: 1.0
      ctde_embedding: 2.0
      ctde_interface: 1.0
      ctde_multistep_jepa_action: 0.1
      ctde_multistep_jepa_cosine: 2.0
      ctde_posterior_alignment: 0.05
      ctde_reward: 1.0
      dyn: 1.0
      dynamics_jepa: 2.0
      posterior_jepa: 2.0
      rep: 0.1
      rew: 1.0
      sigreg: 0.05
    marl:
      ctde:
        critic:
          act: silu
          bins: 255
          dropout: 0.0
          ffup: 4
          heads: 4
          layers: 2
          norm: rms
          outscale: 0.0
          value_layers: 2
          value_units: 256
          width: 256
          winit: trunc_normal_in
        head:
          act: silu
          bins: 255
          layers: 2
          norm: rms
          outscale: 0.0
          units: 256
          winit: trunc_normal_in
        imagination_mask_sampling: bernoulli
        joint:
          act: silu
          action_conditioning: add
          agent_layers: 2
          context: 16
          dropout: 0.1
          ffup: 4
          heads: 4
          norm: rms
          temporal_layers: 12
          width: 256
          winit: trunc_normal_in
        multistep_jepa:
          act: silu
          action_counterfactual_mode: all_legal_mean
          action_margin: 0.1
          decay: 0.75
          horizons:
            - 1
            - 2
            - 4
            - 8
          layers: 2
          max_horizon: 8
          norm: rms
          units: 512
          width: 256
          winit: trunc_normal_in
        opt:
          agc: 0.3
          anneal: 0
          beta1: 0.9
          beta2: 0.999
          eps: 1e-20
          lr: 0.0001
          momentum: true
          schedule: const
          warmup: 0
          wd: 0.0
        self_fed:
          anchors: 8
          bptt_steps: 2
          horizons:
            - 2
            - 4
            - 5
          scale: 0.1
          trajectory_kl_scale: 0.1
      execution: strict_decentralized
      stage: ctde
    maskhead:
      act: silu
      layers: 1
      norm: rms
      output: binary
      outscale: 0.0
      units: 512
      winit: trunc_normal_in
    num_agents: 5
    opt:
      agc: 0.3
      anneal: 0
      beta1: 0.9
      beta2: 0.999
      eps: 1e-20
      lr: 0.0001
      momentum: true
      schedule: const
      warmup: 0
      wd: 0.0
    policy:
      act: silu
      layers: 3
      norm: rms
      outscale: 0.01
      unimix: 0.0
      units: 512
      winit: trunc_normal_in
    policy_dist_disc: categorical
    ppo:
      actor_epochs: 5
      actor_lr: 3e-05
      clip_epsilon: 0.2
      critic_epochs: 5
      critic_lr: 3e-05
      entropy_coefficient: 0.003
      epochs: 5
      lam: 0.95
      optimizer_warmup: 0
      replay_value_lam: 0.95
      replay_value_scale: 0.3
    report: true
    reward_grad: true
    rewhead:
      act: silu
      bins: 255
      layers: 1
      norm: rms
      output: symexp_twohot
      outscale: 0.0
      units: 512
      winit: trunc_normal_in
    sigreg:
      aggregation: per_agent
      knots: 17
      num_proj: 256
    slowvalue:
      every: 1
      rate: 1.0
    target_encoder:
      every: 1
      rate: 0.01
  batch_length: 64
  batch_size: 16
  consec_report: 1
  consec_train: 1
  env:
    smac:
      continuing_episode: true
      difficulty: '7'
      use_seed: true
  errfile: false
  ipv6: false
  jax:
    compute_dtype: bfloat16
    coordinator_address: ''
    debug: false
    enable_policy: true
    expect_devices: 0
    jit: true
    mock_devices: 0
    platform: cuda
    policy_devices:
      - 0
    prealloc: true
    precompile: true
    profiler: false
    train_devices:
      - 0
  logdir: ./runs/{timestamp}
  logger:
    filter:
      score|return|length|fps|ratio|sample_age|replay/behavior_|schedule/|counters/|replay_views/|train/loss/|train/opt/|train/ppo/|train/ctde/|report/ctde/|central_critic/|battle_won|win_rate|legacy_|corrected_|enemy_|ally_|timeout|action_|attack_target_|eval/|episode/|final_eval/|replay/world_uniform_|imagined_action/
    fps: 15
    outputs:
      - jsonl
    timer: true
  replay:
    chunksize: 1024
    online: false
    recency_decay: 0.9998
    sampling: recent_world_uniform_behavior
    size: 250000
    world_uniform_mix: 0.5
  replay_context: 192
  replica: 0
  replicas: 1
  report_length: 32
  run:
    checkpoint_at_curve_eval: true
    curve_eval_eps: 32
    curve_eval_interval: 5000
    curve_eval_policy_mode: eval
    curve_eval_seed_offset: 50000
    debug: false
    envs: 1
    episode_timeout: 180
    eval_envs: 4
    eval_eps: 100
    eval_policy_mode: eval
    eval_worker_offset: 0
    final_save: true
    from_checkpoint: ''
    isolate_report_rng: true
    log_every: 120
    ppo_start_step: 5000
    report_batches: 1
    report_every: 300
    save_every: 900
    steps: 50000
    train_ratio: 128
    usage:
      gc: false
      gputil: false
      malloc: false
      nvsmi: true
      psutil: true
    world_model_start_step: 5000
  script: train
  seed: 0
  task: smac_2s3z
reference: {}
wm_lr15e5:
  agent:
    opt:
      lr: 0.00015
    marl:
      ctde:
        opt:
          lr: 0.00015
wm2048:
  agent:
    dyn:
      parallel_transformer:
        deter: 2048
wm2048_lr15e5:
  agent:
    dyn:
      parallel_transformer:
        deter: 2048
    opt:
      lr: 0.00015
    marl:
      ctde:
        opt:
          lr: 0.00015
