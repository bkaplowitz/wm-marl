[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=69", "wheel"]

[project]
dependencies = [
  "chex",
  "einops",
  "elements>=3.19.1",
  "granular>=0.20.3",
  "jax==0.4.36",
  "matplotlib",
  "ninjax>=3.5.1",
  "numpy<2",
  "optax",
  "portal>=3.5.0",
  "ruamel.yaml",
  "scope>=0.4.4",
  "wandb>=0.18",
]
description = "Decoder-free JEPA world models for single-agent and multi-agent RL."
license = "MIT"
name = "dreamarl"
readme = "README.md"
requires-python = ">=3.11,<3.12"
version = "0.1.0"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.4.36"]
dev = [
  "jaxlib==0.4.36",
  "pre-commit>=4.6",
  "pytest>=8",
  "ruff==0.15.18",
]
dmc = ["dm-control>=1.0"]
smac = [
  "s2clientprotocol==5.0.14.93333.0",
  "smac @ git+https://github.com/oxwhirl/smac.git@d6aab33f76abc3849c50463a8592a84f59a5ef84",
]

[project.scripts]
dreamarl-setup-dreamerv3 = "dreamarl.scripts.setup_dreamerv3:main"
dreamarl-train-dmc-dreamerv3 = "dreamarl.scripts.train_dmc_dreamerv3:main"
dreamarl-eval-dmc-dreamerv3 = "dreamarl.scripts.eval_dmc_dreamerv3:main"
dreamarl-normalize-dreamerv3 = "dreamarl.scripts.normalize_dreamerv3_run:main"
dreamarl-setup-dreamer-cdp = "dreamarl.scripts.setup_dreamer_cdp:main"
dreamarl-train-dmc-dreamer-cdp = "dreamarl.scripts.train_dmc_dreamer_cdp:main"
dreamarl-eval-dmc-dreamer-cdp = "dreamarl.scripts.eval_dmc_dreamer_cdp:main"
dreamarl-setup-nedreamer = "dreamarl.scripts.setup_nedreamer:main"
dreamarl-train-dmc-nedreamer = "dreamarl.scripts.train_dmc_nedreamer:main"
dreamarl-eval-dmc-nedreamer = "dreamarl.scripts.eval_dmc_nedreamer:main"
dreamarl-train-marie = "dreamarl.scripts.train_marie:main"
dreamarl-train-dreamarl = "dreamarl.scripts.train_dreamarl:main"
dreamarl-eval-dreamarl = "dreamarl.scripts.eval_dreamarl:main"
dreamarl-plot-dreamarl-paper = "dreamarl.scripts.plot_dreamarl_paper:main"
dreamarl-train-dreamarl-ablation = "dreamarl.ablations.train:main"
dreamarl-eval-dreamarl-ablation = "dreamarl.ablations.eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dreamarl" = ["LICENSE", "configs.yaml"]
"dreamarl.ablations" = ["configs.yaml", "README.md"]

[tool.pytest.ini_options]
markers = [
  "integration: tests requiring an external simulator runtime",
  "dreamerv3_integration: tests requiring the isolated DreamerV3 runtime",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
exclude = [".venv"]

[tool.ruff]
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
