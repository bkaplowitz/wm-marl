[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=69", "wheel"]

[project]
dependencies = [
  "chex",
  "einops",
  "elements>=3.19.1",
  "granular>=0.20.3",
  "jax==0.4.36",
  "ninjax>=3.5.1",
  "numpy<2",
  "optax",
  "portal>=3.5.0",
  "ruamel.yaml",
  "scope>=0.4.4",
  "wandb>=0.18",
]
description = "MA-JEPA: decoder-free JEPA world models for multi-agent RL."
license = "MIT"
name = "majepa"
readme = "README.md"
requires-python = ">=3.11,<3.12"
version = "0.1.0"

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.4.36"]
dev = [
  "jaxlib==0.4.36",
  "pre-commit>=4.6",
  "pytest>=8",
  "ruff==0.15.18",
]
smac = [
  "s2clientprotocol==5.0.14.93333.0",
  "smac @ git+https://github.com/oxwhirl/smac.git@d6aab33f76abc3849c50463a8592a84f59a5ef84",
]

[project.scripts]
majepa-train = "majepa.scripts.train:main"
majepa-evaluate = "majepa.scripts.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"majepa" = ["LICENSE", "configs.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
exclude = [".venv"]

[tool.ruff]
exclude = ["external"]
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
